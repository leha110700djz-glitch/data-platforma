# dbt project — data-platform
# Demonstrates: слоистая модель staging/intermediate/marts, hooks, Slim CI, контракты

name: 'data_platform'
version: '1.0.0'
config-version: 2

profile: 'data_platform'

model-paths: ["models"]
seed-paths:  ["seeds"]
test-paths:  ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Quoting identifiers for case-safety in Trino / Spark
quoting:
  database: false
  schema:   true
  identifier: true

# Models configuration: 3 layers (staging → intermediate → marts)
models:
  data_platform:
    +materialized: view
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging", "hourly"]
    intermediate:
      +schema: intermediate
      +materialized: ephemeral
      +tags: ["intermediate"]
    marts:
      +schema: marts
      +materialized: table
      +tags: ["marts", "daily"]
      +persist_docs:
        relation: true
        columns: true
      +on_schema_change: "fail"           # strict schema change handling
      +contracts:
        enforced: true                    # dbt 1.7 contracts enforcement
      +post-hook:
        - "ANALYZE {{ this }}"            # update stats for query planner
      +tags: ["marts", "daily"]

snapshots:
  +target_schema: snapshots
  +tags: ["snapshots", "scd2"]

# Hooks: global pre/post actions on every dbt invocation
on-run-start:
  - "create schema if not exists {{ env_var('DBT_SCHEMA_STAGING', 'staging') }}"
  - "create schema if not exists {{ env_var('DBT_SCHEMA_INTERMEDIATE', 'intermediate') }}"
  - "create schema if not exists {{ env_var('DBT_SCHEMA_MARTS', 'marts') }}"
on-run-end:
  - "{{ log('dbt run finished at ' ~ run_started_at ~ ' — ' ~ modules.datetime.datetime.now(), info=True) }}"

# Slim CI: only build modified models + their descendants
dispatch:
  - macro_namespace: dbt_utils
    search_order: ['dbt_utils', 'data_platform']
